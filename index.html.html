<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8"><title>JJK Phantom Modifier V0.2</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17191d;background:#f5f6f8}
*{box-sizing:border-box}body{margin:0;padding:22px 16px 40px;max-width:680px;margin:auto}
header{padding:12px 4px 18px}small,.muted{color:#747982}h1{font-size:28px;margin:5px 0}h2{font-size:17px;margin:0 0 14px}
.card{background:#fff;border:1px solid #e8e9ed;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 2px 10px #10182808}
.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1}
button{border:0;border-radius:12px;padding:12px 15px;background:#20242b;color:white;font-size:15px;font-weight:600}
button.secondary{background:#eef0f3;color:#20242b}button.danger{background:#fff0f0;color:#a22}
label{display:block;font-size:13px;color:#60656e;margin:10px 0 5px}
input{width:100%;padding:12px;border:1px solid #dfe2e7;border-radius:10px;font-size:16px;background:#fff;color:#17191d}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result{font-size:34px;font-weight:750;letter-spacing:-1px;margin:5px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.item{padding:12px 0;border-bottom:1px solid #eee}.item:last-child{border:0}
.notice{font-size:12px;line-height:1.5;color:#747982}.hidden{display:none}
</style>
</head>
<body>
<header><small>PHANTOM NIGHT · CHARACTER LAB</small><h1>JJK Phantom Modifier</h1><div class="muted">獨立角色資料與傷害研究工具 · V0.2</div></header>
<div class="tabs"><button id="tabData">角色資料</button><button class="secondary" id="tabCalc">傷害測試</button></div>
<section id="dataView">
<div class="card"><h2>角色資料庫</h2><div id="list"></div><button class="secondary" id="add">＋ 新增角色</button></div>
<div class="card"><h2 id="formTitle">角色編輯</h2>
<label>角色名稱</label><input id="name" value="測試角色 A" maxlength="40">
<div class="grid"><div><label>HP</label><input id="hp" type="number" min="0" value="25000"></div>
<div><label>攻擊力 ATK</label><input id="atk" type="number" min="0" value="5000"></div>
<div><label>防禦力 DEF</label><input id="def" type="number" min="0" value="2000"></div>
<div><label>模擬倍率</label><input id="mult" type="number" min="0.01" step="0.1" value="1"></div></div>
<div class="row" style="margin-top:14px"><button id="save">儲存角色</button><button class="danger" id="remove">刪除</button></div></div>
</section>
<section id="calcView" class="hidden">
<div class="card"><h2>傷害倍率計算器</h2><label>選擇角色</label><select id="choose" style="width:100%;padding:12px;border:1px solid #dfe2e7;border-radius:10px;font-size:16px"></select>
<label>原始傷害</label><input id="base" type="number" min="0" value="5000">
<label>自訂倍率</label><input id="factor" type="number" min="0.01" step="0.1" value="2">
<div class="muted" style="margin-top:15px">模擬結果</div><div class="result" id="result">10,000</div><div class="notice">計算公式：原始傷害 × 自訂倍率。此結果僅供獨立模擬，不代表遊戲內實際傷害。</div></div>
</section>
<div class="card notice">資料儲存在目前瀏覽器的本機儲存空間。清除瀏覽器資料或更換裝置可能使資料消失。此工具不連接遊戲、不讀取其他 App 資料，也不修改遊戲伺服器或線上戰鬥結果。</div>
<script>
const $=id=>document.getElementById(id);
let chars=JSON.parse(localStorage.getItem('jjkpm_chars')||'null')||[{id:crypto.randomUUID(),name:'測試角色 A',hp:25000,atk:5000,def:2000,mult:1}];
let current=chars[0]?.id||null;
function persist(){localStorage.setItem('jjkpm_chars',JSON.stringify(chars));render()}
function render(){
 $('list').innerHTML=chars.map(c=>`<div class="item row"><button class="secondary" data-id="${c.id}" style="text-align:left;flex:1">${escapeHtml(c.name)}<br><small>HP ${c.hp} · ATK ${c.atk} · DEF ${c.def}</small></button><button class="secondary" data-edit="${c.id}">編輯</button></div>`).join('')||'<p class="muted">尚無角色，請新增。</p>';
 document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>load(b.dataset.id));
 document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>load(b.dataset.edit));
 $('choose').innerHTML=chars.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
 if(current && chars.some(c=>c.id===current))$('choose').value=current;
 calc();
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function load(id){let c=chars.find(x=>x.id===id);if(!c)return;current=id;$('name').value=c.name;$('hp').value=c.hp;$('atk').value=c.atk;$('def').value=c.def;$('mult').value=c.mult;$('formTitle').textContent='編輯角色'}
function valid(){return $('name').value.trim()&&['hp','atk','def','mult'].every(k=>Number.isFinite(+$ (k).value)&&+$ (k).value>=0)&&+$('mult').value>0}
$('save').onclick=()=>{if(!valid()){alert('請輸入有效的數值');return}let c={id:current||crypto.randomUUID(),name:$('name').value.trim(),hp:+$('hp').value,atk:+$('atk').value,def:+$('def').value,mult:+$('mult').value};let i=chars.findIndex(x=>x.id===c.id);if(i<0)chars.push(c);else chars[i]=c;current=c.id;persist();$('formTitle').textContent='編輯角色'};
$('add').onclick=()=>{current=null;$('name').value='新角色';$('hp').value=0;$('atk').value=0;$('def').value=0;$('mult').value=1;$('formTitle').textContent='新增角色'};
$('remove').onclick=()=>{if(!current)return;chars=chars.filter(c=>c.id!==current);current=chars[0]?.id||null;persist();if(current)load(current);else $('add').click()};
$('base').oninput=$('factor').oninput=calc;$('choose').onchange=()=>{current=$('choose').value;let c=chars.find(x=>x.id===current);if(c)$('factor').value=c.mult;calc()};
function calc(){let n=(+$('base').value||0)*(+$('factor').value||0);$('result').textContent=Math.round(n).toLocaleString('en-US')}
$('tabData').onclick=()=>{$('dataView').classList.remove('hidden');$('calcView').classList.add('hidden');$('tabData').className='';$('tabCalc').className='secondary'};
$('tabCalc').onclick=()=>{$('dataView').classList.add('hidden');$('calcView').classList.remove('hidden');$('tabCalc').className='';$('tabData').className='secondary';calc()};
render();if(current)load(current);
</script>
</body></html>
